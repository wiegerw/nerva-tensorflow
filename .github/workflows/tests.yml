name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# TensorFlow does not provide wheels for Python 3.14 yet.

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Show versions
        run: python -m pip list
      - name: Run tests
        run: python -m pytest tests -ra

  # Checks that the minimum versions declared in pyproject.toml still work.
  minimum-versions:
    name: Minimum versions (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "tensorflow==2.13.0" "numpy==1.23.2" ".[test]"
      - name: Show versions
        run: python -m pip list
      - name: Run tests
        run: python -m pytest tests -ra
